name: Checks

# Checks every link and image in the Markdown files, that the Python is valid,
# and that submissions follow the rules in CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python .github/scripts/check_repo.py
